name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check that the tag matches package.json
        run: |
          node -e "const p=require('./package.json');const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(p.version!==tag){console.error('tag',tag,'does not match version',p.version);process.exit(1)}"
      - name: Check whether this version is already on npm
        id: npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@voidh4x0r/slopgate@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Warn when NPM_TOKEN is missing
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not configured; skipping npm publish (the GitHub release will still be created)."
      - name: Publish
        if: env.NODE_AUTH_TOKEN != '' && steps.npm.outputs.exists == 'false'
        run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists: $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
