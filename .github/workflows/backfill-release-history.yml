name: Backfill labels and releases

# One-off admin workflow. Run it manually from the Actions tab after this file
# reaches main; it creates the two issue labels and the historical releases
# that predate the release workflow. Safe to re-run: existing labels/releases
# are left alone. Delete the workflow after the backfill.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create issue labels
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -e
          gh label create false-positive --color d73a4a --description "Confirmed or suspected false positive" 2>/dev/null || true
          gh label edit false-positive --color d73a4a --description "Confirmed or suspected false positive"
          gh label create precision --color 0e8a16 --description "Precision / false-positive benchmark work" 2>/dev/null || true
          gh label edit precision --color 0e8a16 --description "Precision / false-positive benchmark work"

      - name: Show token permissions and tag rules
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" --jq '{permissions: .permissions}' || true
          gh api "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true" --jq '.[] | {name: .name, target: .target, enforcement: .enforcement}' || true

      - name: Create historical tags and releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -e
          while read -r tag sha; do
            [ -z "$tag" ] && continue
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release already exists: $tag"
              continue
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "tag already exists: $tag"
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${tag}" -f sha="$sha"
            fi
            gh release create "$tag" --title "slopgate ${tag#v}" --generate-notes
          done <<'EOF'
          v0.1.0 cbc5cdf88f0470611a9a7c316cee56779cfa1128
          v0.1.1 4d905d2de06b66400a9a717a471cdbf1b1bcaec9
