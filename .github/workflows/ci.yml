name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:encoding
      - run: node scripts/check-links.mjs
      - run: node scripts/set-repo.mjs --self-test
      - run: npm test
      - run: npm run build
      - name: Lint itself
        run: node dist/cli.js . --fail-on high

  runtime:
    name: runtime (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js --version
      - run: node dist/cli.js fixtures/demo --format json --fail-on none
      - run: node -e "import('./dist/index.js').then((m) => { if (typeof m.scanProject !== 'function' || m.CONTRACT_VERSION !== 1) process.exit(1); })"

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify the tarball ships the grammars
        run: npm pack --dry-run
      - name: Install the packed tarball and run it
        run: |
          set -euo pipefail
          npm pack
          TARBALL=$(ls -1 "${GITHUB_WORKSPACE}"/*.tgz | head -n 1)
          echo "tarball: ${TARBALL}"
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install "${TARBALL}"
          printf 'import requests_v2\n\n\ndef handler():\n    pass\n' > sample.py
          ./node_modules/.bin/slopgate --version
          set +e
          ./node_modules/.bin/slopgate sample.py --fail-on high --no-color
          status=$?
          set -e
          test "$status" -eq 1
      - name: Scan a Go file from the packed tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/gosmoke && cd /tmp/gosmoke
          printf 'module example.com/x\n\ngo 1.24\n' > go.mod
          printf 'package main\n\nimport "github.com/nope/missing"\n\nfunc main() {}\n' > main.go
          set +e
          /tmp/smoke/node_modules/.bin/slopgate main.go --fail-on high --no-color
          status=$?
          set -e
          test "$status" -eq 1
      - name: Scan a Rust file from the packed tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/rustsmoke && cd /tmp/rustsmoke
          printf '[package]\nname = "smoke"\nversion = "0.1.0"\nedition = "2021"\n' > Cargo.toml
          printf 'fn stub() -> i32 {\n    todo!()\n}\n' > main.rs
          set +e
          /tmp/smoke/node_modules/.bin/slopgate main.rs --fail-on high --no-color
          status=$?
          set -e
          test "$status" -eq 1

  extension:
    name: vs code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/slopgate-vscode/package-lock.json
      - run: npm ci --prefix packages/slopgate-vscode
      - run: npm run typecheck --prefix packages/slopgate-vscode
      - run: npm test --prefix packages/slopgate-vscode

  encoding-windows:
    name: encoding (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-encoding.mjs

  windows:
    name: windows test (node 24)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:encoding
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js fixtures/demo --fail-on none
      - run: npm pack --dry-run

  windows-runtime:
    name: windows runtime (node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js --version
      - run: node dist/cli.js fixtures/demo --format json --fail-on none
      - run: node -e "import('./dist/index.js').then((m) => { if (typeof m.scanProject !== 'function' || m.CONTRACT_VERSION !== 1) process.exit(1); })"

